name: Quelnaris Daily Short

on:
  schedule:
    # UTC 23:00 = TR 02:00 = EST 19:00
    - cron: '0 23 * * *'
  workflow_dispatch:  # Manuel tetikleme

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-inter

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create necessary directories
        run: |
          mkdir -p output logs assets/music assets/fonts

      - name: Run Quelnaris pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_TOKEN: ${{ secrets.YT_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python -m src.main

      - name: Upload video artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quelnaris-video-${{ github.run_number }}
          path: |
            output/final.mp4
            output/visual_prompts.json
            logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Commit state files
        if: always()
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add logs/used_topics.json logs/upload_log.json 2>/dev/null || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update state [skip ci]"
          git push 2>/dev/null || true